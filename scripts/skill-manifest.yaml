# Agent Skills shipped in the nextpnr-bin release tarball.
# Consumed by update/stage-skills.py from scripts/build.sh.
# See SKILL_DEVELOPMENT_PROCESS.md (repo root) for the authoring process.
skills:
  - name: nextpnr
    path: skills/nextpnr
    # HIMBAECHEL_SPLIT=ON yields split gowin/gatemate binaries (no plain nextpnr-himbaechel).
    binaries: [nextpnr-ice40, nextpnr-ecp5, nextpnr-machxo2, nextpnr-mistral, nextpnr-himbaechel-gowin, nextpnr-himbaechel-gatemate, nextpnr-generic]
