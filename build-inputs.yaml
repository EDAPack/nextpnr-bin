# Input components for nextpnr-bin, resolved by edapack-common's
# resolve-inputs.py. See https://edapack.github.io (Developer Guide → build-inputs).
#
# Note: the apicula (apycula) and intervaltree chipdb generators are pip
# build-time tools baked into the builder image; they are not git-tracked here.
#
# Component notes (kept out of the body below because the published @v1
# resolver's YAML parser neither strips trailing inline comments nor skips
# comment lines when deciding a block's type):
#   core nextpnr   - policy latest-tag; pin with core_ref=nextpnr-0.10 (or a branch/sha)
#   icestorm       - chipdb data (share/icebox) for ice40
#   prjtrellis     - pytrellis -> ECP5/MachXO2 chipdb (build-time)
#   mistral        - Cyclone V; compiled inline by nextpnr
#   prjpeppercorn  - GateMate device db (build-time). Pinned to tag:v1.12
#                    (DATABASE_VERSION 1.12) to match nextpnr-0.10's gatemate
#                    arch_gen.py EXPECTED_VERSION=1.12. branch:main has moved to
#                    1.13 and fails the version check (silent os._exit(-1) -> 255).
#                    Re-pin when bumping the nextpnr core_ref to a 1.13 release.
schema: edapack.build-inputs/1

core:
  name: nextpnr
  repo: https://github.com/YosysHQ/nextpnr
  policy: latest-tag

dependencies:
  - name: icestorm
    repo: https://github.com/YosysHQ/icestorm
    policy: branch:main
  - name: prjtrellis
    repo: https://github.com/YosysHQ/prjtrellis
    policy: branch:main
  - name: mistral
    repo: https://github.com/Ravenslofty/mistral
    policy: branch:nextpnr-latest
  - name: prjpeppercorn
    repo: https://github.com/YosysHQ/prjpeppercorn
    policy: tag:v1.12
