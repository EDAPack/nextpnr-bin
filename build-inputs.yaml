# Input components for nextpnr-bin, resolved by edapack-common's
# resolve-inputs.py. See https://edapack.github.io (Developer Guide → build-inputs).
#
# Note: the apicula (apycula) and intervaltree chipdb generators are pip
# build-time tools baked into the builder image; they are not git-tracked here.
#
# Keep comments on their own lines: the published @v1 resolver does not strip
# trailing inline comments, so `policy: latest-tag  # ...` would be parsed with
# the comment attached and rejected as an unknown policy.
schema: edapack.build-inputs/1

core:
  name: nextpnr
  repo: https://github.com/YosysHQ/nextpnr
  # pin with core_ref=nextpnr-0.10 (or a branch/sha)
  policy: latest-tag

dependencies:
  # chipdb data (share/icebox) for ice40
  - name: icestorm
    repo: https://github.com/YosysHQ/icestorm
    policy: branch:main
  # pytrellis -> ECP5/MachXO2 chipdb (build-time)
  - name: prjtrellis
    repo: https://github.com/YosysHQ/prjtrellis
    policy: branch:main
  # Cyclone V; compiled inline by nextpnr
  - name: mistral
    repo: https://github.com/Ravenslofty/mistral
    policy: branch:nextpnr-latest
  # GateMate device db (build-time)
  - name: prjpeppercorn
    repo: https://github.com/YosysHQ/prjpeppercorn
    policy: branch:main
