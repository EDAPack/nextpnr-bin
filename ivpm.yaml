package:
  name: nextpnr-bin

  # NOTE: this file describes how to *build* nextpnr-bin and is not shipped.
  # The manifest a release carries is scripts/release-ivpm.yaml, staged as
  # ivpm.yaml by edapack-common's ec_stage_release_ivpm — keep the two in sync
  # when the PATH layout or runtime deps change.
  env:
  - name: PATH
    path-prepend: "${IVPM_PACKAGES}/nextpnr-bin/bin"

  dep-sets:
  - name: default-dev
    deps:
    - name: edapack-common
      url: https://github.com/edapack/edapack-common.git
    - name: nextpnr
      url: https://github.com/YosysHQ/nextpnr.git
